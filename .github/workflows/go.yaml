name: Go validation

on:
  pull_request:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify dependencies
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Test notifications with local mocks
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
